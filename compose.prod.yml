services:
  web:
    image: "${IMAGE_URI:?Set IMAGE_URI to the immutable ECR image tag}"
    container_name: flexgcc-outreach-web
    restart: unless-stopped
    env_file:
      - /etc/flexgcc-outreach.env
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
