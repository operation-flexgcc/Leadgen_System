name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadgen_test
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: leadgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://leadgen_test:ci-only-local-password@localhost:5432/leadgen_test
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Test PostgreSQL migrations and transactional workflows
        run: python manage.py test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run application checks
        run: python manage.py check
      - name: Check deployment scripts
        run: bash -n deploy.sh deploy/aws/deploy.sh
      - name: Run tests
        run: python manage.py test
      - name: Check production security settings
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-long-production-check-secret-key-not-used-at-runtime
          DJANGO_ALLOWED_HOSTS: outreach.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://outreach.example.com
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level ERROR
      - name: Build static assets
        run: python manage.py collectstatic --noinput
      - name: Build production container
        run: docker build --tag flexgcc-outreach:${{ github.sha }} .
